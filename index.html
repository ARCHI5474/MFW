<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money for what?</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
 <main>

    <header>
       <h1>Money for what?</h1>
       <p>お金の使い道を決めよう。</p>
    </header>

    <hr>
    <h2>振り分けよう</h2>
    <section>
        <label for="month-salary">今月の給料：</label>
        <input type="number" id="month-salary" placeholder="給料を入力">
    </section>

    <section>
        <label for="amount">金額：</label>
        <input type="number" id="amount" placeholder="金額を入力">
        <label for="purpose">用途：</label>
        <input type="text" id="purpose" placeholder="用途を入力">
        <label for="note">備考：</label>
        <input type="text" id="note" placeholder="備考を入力">
 </main>
</body>
</html>
